<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MEDICARE — DESIGN TOKENS
   Signature: capsule buttons w/ visible center seam (medicine
   capsule motif) + pulse-line dividers (heartbeat/vital motif).
   ============================================================ */
:root{
  --ink:#0E2E29;
  --bg:#F1F6F0;
  --surface:#FFFFFF;
  --surface-alt:#EEF6F0;
  --teal:#145C54;
  --teal-light:#1F7A6C;
  --teal-pale:#E3F1EC;
  --coral:#FF6A4D;
  --coral-dark:#E4512F;
  --coral-pale:#FFE7E0;
  --gold:#E4A73B;
  --gold-pale:#FBEDD1;
  --green:#2FA84F;
  --green-pale:#E3F5E7;
  --red:#D64545;
  --red-pale:#FCE7E5;
  --line:#DEE7E0;
  --muted:#65786F;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius-card:20px;
  --radius-capsule:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- backdrop ambience ---------- */
.stage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
  position:relative;
  overflow:hidden;
}
.stage::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(20,92,84,0.10), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(255,106,77,0.10), transparent 45%);
  pointer-events:none;
}
.stage-label{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  z-index:5;
  opacity:.75;
}

/* ---------- phone frame ---------- */
.phone{
  width:390px;
  max-width:100%;
  height:844px;
  max-height:92vh;
  background:var(--ink);
  border-radius:46px;
  padding:14px;
  box-shadow:0 30px 70px -20px rgba(14,46,41,0.45), 0 0 0 1px rgba(14,46,41,0.06);
  position:relative;
  z-index:2;
}
.phone::before{
  content:"";
  position:absolute;
  top:14px; left:50%; transform:translateX(-50%);
  width:120px; height:26px;
  background:var(--ink);
  border-radius:0 0 18px 18px;
  z-index:20;
}
.screen{
  width:100%;height:100%;
  background:var(--surface);
  border-radius:34px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.screen-scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -ms-overflow-style:none;
  scrollbar-width:none;
}
.screen-scroll::-webkit-scrollbar{display:none;}

@media (max-width:460px){
  .stage{padding:0;}
  .phone{
    width:100vw;height:100vh;max-height:100vh;border-radius:0;padding:0;box-shadow:none;
  }
  .phone::before{display:none;}
  .screen{border-radius:0;}
}

/* ---------- typography ---------- */
.h-display{
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--teal-light);
}
.muted{color:var(--muted);}
.mono{font-family:var(--font-mono);}

/* ---------- pulse divider (signature) ---------- */
.pulse-divider{
  width:100%;
  height:22px;
  margin:2px 0;
  opacity:.55;
}
.pulse-divider svg{width:100%;height:100%;display:block;}
.pulse-divider path{
  fill:none;
  stroke:var(--teal-light);
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:none;
  border-radius:var(--radius-capsule);
  padding:15px 22px;
  font-size:15px;
  font-weight:700;
  width:100%;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  position:relative;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(180deg, var(--coral), var(--coral-dark));
  color:#fff;
  box-shadow:0 10px 22px -8px rgba(228,81,47,0.55);
}
/* capsule seam motif */
.btn-primary::after, .btn-secondary::after{
  content:"";
  position:absolute;
  left:50%; top:20%; bottom:20%;
  width:1px;
  background:rgba(255,255,255,0.35);
}
.btn-secondary{
  background:var(--surface);
  color:var(--teal);
  border:1.5px solid var(--teal);
}
.btn-secondary::after{background:rgba(20,92,84,0.18);}
.btn-ghost{
  background:transparent;
  color:var(--teal);
  font-weight:600;
  width:auto;
  padding:8px 4px;
}
.btn-ghost::after{display:none;}
.btn-sm{padding:10px 16px;font-size:13px;}
.btn-block-row{display:flex;gap:10px;}
.btn:disabled{opacity:.45;pointer-events:none;}

/* ---------- top bar / nav ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 20px 14px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  flex-shrink:0;
}
.topbar .back{
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;
  border:none;flex-shrink:0;
}
.topbar h1{font-size:17px;margin:0;font-family:var(--font-body);font-weight:700;flex:1;}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px;}

.bottomnav{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--surface);
  flex-shrink:0;
  padding:10px 6px 14px;
}
.bottomnav button{
  flex:1;background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted);font-size:10.5px;font-weight:600;padding:4px;
}
.bottomnav button.active{color:var(--teal);}
.bottomnav svg{width:21px;height:21px;}

/* ---------- generic layout helpers ---------- */
.pad{padding:18px 20px;}
.section{padding:6px 20px 18px;}
.row{display:flex;align-items:center;gap:12px;}
.col{display:flex;flex-direction:column;}
.gap8{gap:8px;} .gap10{gap:10px;} .gap14{gap:14px;} .gap6{gap:6px;}
.space-between{justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

/* ---------- cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  padding:16px;
}
.card-alt{background:var(--surface-alt);border-color:transparent;}
.card-tap{transition:transform .12s ease, box-shadow .12s ease;}
.card-tap:active{transform:scale(.98);}

.avatar{
  width:52px;height:52px;border-radius:16px;
  background:var(--teal-pale);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--teal);
  flex-shrink:0;
}
.avatar.round{border-radius:50%;}
.avatar.sm{width:40px;height:40px;font-size:15px;border-radius:12px;}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--radius-capsule);
  font-size:10.5px;font-weight:700;
}
.badge-green{background:var(--green-pale);color:var(--green);}
.badge-gold{background:var(--gold-pale);color:#96731D;}
.badge-red{background:var(--red-pale);color:var(--red);}
.badge-teal{background:var(--teal-pale);color:var(--teal);}
.badge-coral{background:var(--coral-pale);color:var(--coral-dark);}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-green{background:var(--green);}
.dot-red{background:var(--red);}
.dot-gold{background:var(--gold);}

.field{margin-bottom:14px;}
.field label{
  display:block;font-size:12px;font-weight:700;color:var(--teal);
  margin-bottom:6px;letter-spacing:.02em;
}
.field input, .field select, .field textarea{
  width:100%;padding:13px 14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface-alt);
  font-size:14.5px;color:var(--ink);outline:none;
  transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal-light);}
.field-hint{font-size:11px;color:var(--muted);margin-top:5px;}

.searchbar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-alt);border:1.5px solid var(--line);
  border-radius:var(--radius-capsule);padding:12px 16px;
}
.searchbar input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}

.stars{color:var(--gold);font-size:12px;letter-spacing:1px;}

.upload-box{
  border:1.6px dashed var(--teal-light);
  border-radius:16px;background:var(--teal-pale);
  padding:16px;text-align:center;color:var(--teal);
  font-size:12.5px;font-weight:600;
}
.upload-box.done{border-style:solid;border-color:var(--green);background:var(--green-pale);color:#1E7A38;}

.stepper{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.stepper .seg{flex:1;height:4px;border-radius:2px;background:var(--line);}
.stepper .seg.on{background:var(--teal);}

.toast{
  position:absolute;left:16px;right:16px;bottom:96px;
  background:var(--ink);color:#fff;padding:13px 16px;border-radius:16px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 30px -10px rgba(0,0,0,.4);
  z-index:80;
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.empty{
  text-align:center;padding:40px 20px;color:var(--muted);
}

/* ---------- floating AI assistant ---------- */
.ai-fab{
  position:absolute;right:16px;bottom:88px;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(160deg,var(--teal),var(--teal-light));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 24px -8px rgba(20,92,84,0.55);
  border:none;z-index:60;
  animation:fabpulse 2.6s ease infinite;
}
.ai-fab svg{width:24px;height:24px;}
@keyframes fabpulse{
  0%,100%{box-shadow:0 12px 24px -8px rgba(20,92,84,0.55);}
  50%{box-shadow:0 12px 30px -6px rgba(20,92,84,0.75);}
}
.ai-fab.no-nav{bottom:24px;}

.ai-overlay{
  position:absolute;inset:0;z-index:100;
  background:rgba(14,46,41,0.35);
  display:flex;align-items:flex-end;
}
.ai-sheet{
  width:100%;max-height:82%;background:var(--surface);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;
  animation:sheetup .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.ai-head{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.ai-head .grabber{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:2px;background:var(--line);
}
.ai-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;}
.ai-msg.bot{background:var(--surface-alt);border-bottom-left-radius:4px;align-self:flex-start;}
.ai-msg.user{background:var(--teal);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.ai-msg.bot .disclaimer{display:block;margin-top:8px;font-size:10.5px;color:var(--muted);font-style:italic;}
.ai-quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px;}
.ai-quick button{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-capsule);
  padding:8px 13px;font-size:12px;font-weight:600;color:var(--teal);
}
.ai-input-row{
  display:flex;gap:8px;padding:12px 14px 18px;border-top:1px solid var(--line);align-items:center;
}
.ai-input-row input{
  flex:1;border:1.5px solid var(--line);background:var(--surface-alt);
  border-radius:var(--radius-capsule);padding:11px 16px;font-size:13.5px;outline:none;
}
.ai-icon-btn{
  width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ai-icon-btn.send{background:var(--coral);border:none;color:#fff;}
.ai-icon-btn svg{width:18px;height:18px;}

/* utility */
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.center{text-align:center;}
.mt6{margin-top:6px;}.mt10{margin-top:10px;}.mt14{margin-top:14px;}.mt18{margin-top:18px;}.mt24{margin-top:24px;}
.mb10{margin-bottom:10px;}.mb14{margin-bottom:14px;}.mb18{margin-bottom:18px;}
.fade-in{animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="stage-label">MediCare — clickable prototype</div>
<div class="stage">
  <div class="phone">
    <div class="screen" id="screen"></div>
  </div>
</div>

<script>

  support:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 014.9.8c0 1.7-2.4 2-2.4 3.5M12 17.2h.01"/></svg>`,
  headset:`<svg class="icon" viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0116 0v1"/><rect x="2.5" y="13" width="5" height="7" rx="2"/><rect x="16.5" y="13" width="5" height="7" rx="2"/><path d="M20 20a4 4 0 01-4 3h-2"/></svg>`,
};

function pulseDivider(){
  return `<div class="pulse-divider"><svg viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M0 11 H150 L165 2 L180 20 L195 4 L208 11 H400"/></svg></div>`;
}

/* ============================================================
   MOCK DATA
   ============================================================ */
const ROLES = [
  {id:'patient', label:'Patient', icon:ic.user, docs:false},
  {id:'doctor', label:'Doctor', icon:ic.briefcase, docs:true},

const MED_KB = {
  'paracetamol':{use:'Reduces fever and relieves mild to moderate pain.',dose:'Adults: 500–1000mg every 4–6 hours, max 4g/day.',side:'Generally well tolerated; rare liver strain at high doses.',food:'Can be taken with or without food.',interact:'Avoid combining with other paracetamol-containing products.'},
  'ibuprofen':{use:'Anti-inflammatory pain reliever, also reduces fever.',dose:'Adults: 200–400mg every 6–8 hours with food.',side:'May cause stomach upset; avoid on empty stomach.',food:'Take with food or milk to reduce irritation.',interact:'Avoid with blood thinners or other NSAIDs.'},
  'amoxicillin':{use:'Antibiotic for bacterial infections.',dose:'Typically 250–500mg every 8 hours, as prescribed.',side:'May cause mild nausea or diarrhoea.',food:'Can be taken with or without food.',interact:'Inform your doctor of any penicillin allergy.'},
  'cetirizine':{use:'Antihistamine for allergy relief — sneezing, itching, hives.',dose:'Adults: 10mg once daily.',side:'Mild drowsiness in some people.',food:'No food restrictions.',interact:'Avoid combining with other sedating antihistamines.'},
  'azithromycin':{use:'Antibiotic used for respiratory and skin infections.',dose:'Commonly 500mg on day 1, then 250mg daily — follow prescription.',side:'May cause mild stomach discomfort.',food:'Best taken on an empty stomach unless advised otherwise.',interact:'Space apart from antacids by 2 hours.'},
};
function aiLookup(text){
  const q = text.toLowerCase();
  const key = Object.keys(MED_KB).find(k=>q.includes(k));
  if(key){
    const m = MED_KB[key];
    return `<b>${key[0].toUpperCase()+key.slice(1)}</b><br>
      • <b>Usage:</b> ${m.use}<br>
      • <b>Dosage:</b> ${m.dose}<br>
      • <b>Side effects:</b> ${m.side}<br>
      • <b>Food:</b> ${m.food}<br>
      • <b>Interactions:</b> ${m.interact}
      <span class="disclaimer">This is general information, not a substitute for professional medical advice.</span>`;
  }
  return `I couldn't find that exact medicine in my demo library yet — try "Paracetamol", "Ibuprofen", "Amoxicillin", "Cetirizine" or "Azithromycin". You can also upload a photo of the label or prescription and I'll do my best to identify it.
  <span class="disclaimer">This is general information, not a substitute for professional medical advice.</span>`;
}
function openAI(){
  S.aiOpenState = true;
  if(S.aiMessages.length===0){
    S.aiMessages.push({from:'bot', html:`Hi, I'm your MediCare AI Assistant 👋 Ask me about a medicine, or upload a photo of a prescription or label.`});
  }
  rerenderOverlay();
}
function closeAI(){ S.aiOpenState=false; rerenderOverlay(); }
function rerenderOverlay(){
  const existing = document.getElementById('ai-overlay-slot');
  if(existing) existing.outerHTML = aiOverlayHtml();
}
function aiOverlayHtml(){
  if(!S.aiOpenState) return `<div id="ai-overlay-slot"></div>`;
  return `<div id="ai-overlay-slot"><div class="ai-overlay" onclick="if(event.target===this)closeAI()">
    <div class="ai-sheet">
      <div class="ai-head">
        <div class="grabber"></div>
        <div class="avatar sm" style="background:var(--teal-pale)">${ic.chat}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14.5px">AI Assistant</div>
          <div class="sub muted" style="font-size:11.5px">Medicine & prescription info</div>
        </div>
        <button class="back" onclick="closeAI()">${ic.close}</button>
      </div>
      <div class="ai-body" id="ai-body">
        ${S.aiMessages.map(m=>`<div class="ai-msg ${m.from}">${m.html}</div>`).join('')}
      </div>
      <div class="ai-quick">
        <button onclick="aiUpload('prescription')">${ic.file} Upload prescription</button>
        <button onclick="aiUpload('label')">${ic.camera} Scan label</button>
        <button onclick="aiVoiceToggle()">${ic.mic} ${S.aiVoice?'Listening…':'Voice'}</button>
      </div>
      <div class="ai-input-row">
        <button class="ai-icon-btn" onclick="aiUpload('photo')">${ic.upload}</button>
        <input id="ai-text-input" placeholder="Type a medicine name…" onkeydown="if(event.key==='Enter')aiSend()">
        <button class="ai-icon-btn send" onclick="aiSend()">${ic.send}</button>
      </div>
    </div>
  </div></div>`;
}
function aiSend(){
  const input = document.getElementById('ai-text-input');
  const val = input.value.trim();
  if(!val) return;
  S.aiMessages.push({from:'user', html: val});
  S.aiMessages.push({from:'bot', html: aiLookup(val)});
  rerenderOverlay();
  setTimeout(()=>{const b=document.getElementById('ai-body'); if(b)b.scrollTop=b.scrollHeight;},30);
}
function aiUpload(kind){
  const labels = {prescription:'📄 Prescription photo uploaded', label:'📷 Medicine label scanned', photo:'📷 Photo uploaded'};
  S.aiMessages.push({from:'user', html: labels[kind]});
  const responses = {
    prescription:`I can see a prescription for <b>Amoxicillin 250mg</b>, twice daily for 5 days. Would you like details on usage or interactions?`,
    label:`This looks like <b>Cetirizine 10mg</b>. Ask me for dosage, side effects, or interactions any time.`,
    photo:`Got it — this looks like <b>Paracetamol 500mg</b>. Want the usage details?`,
  };
  S.aiMessages.push({from:'bot', html: responses[kind] + `<span class="disclaimer">This is general information, not a substitute for professional medical advice.</span>`});
  rerenderOverlay();
}
function aiVoiceToggle(){
  S.aiVoice = !S.aiVoice;
  if(S.aiVoice){
    S.aiMessages.push({from:'user', html:'🎙️ (voice input) "What is paracetamol used for?"'});
    S.aiMessages.push({from:'bot', html: aiLookup('paracetamol')});
    setTimeout(()=>{S.aiVoice=false; rerenderOverlay();}, 1400);
  }
  rerenderOverlay();
}

/* ============================================================
   ROUTER
   ============================================================ */
function go(screen, params){
  S.hist.push({screen, params: params||{}});
  render();
}
function goReplace(screen, params){
  S.hist[S.hist.length-1] = {screen, params: params||{}};
  render();
}
function goBack(){
  if(S.hist.length>1){ S.hist.pop(); render(); }
}
function goRoot(screen, params){
  S.hist = [{screen, params: params||{}}];
  render();
}
function current(){ return S.hist[S.hist.length-1]; }

function showToast(msg){
  const el = document.getElementById('screen');
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = `<span style="color:#7FE0A0">${ic.check}</span> ${msg}`;
  el.appendChild(t);
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(()=>t.remove(), 2600);
}
function pushNotification(title, body){
  S.notifications.unshift({id:Date.now(), title, body, time:'Just now'});
}

function render(){
  const {screen, params} = current();
  const fn = SCREENS[screen];
  const html = fn ? fn(params) : `<div class="pad">Screen not found: ${screen}</div>`;
  document.getElementById('screen').innerHTML = html + aiOverlayHtml();
  if(screen==='splash'){
    setTimeout(()=>{ if(current().screen==='splash') goRoot('welcome'); }, 1400);
  }
}

    actions = `<button class="btn btn-primary" onclick="setApptStatus('${a.id}','consulting');go('proConsult',{id:'${a.id}'})">${ic.video} Start Consultation</button>`;
  } else if(a.status==='consulting'){
    actions = `<button class="btn btn-primary" onclick="go('proConsult',{id:'${a.id}'})">${ic.video} Resume Consultation</button>`;

    actions = `<div class="badge badge-green">${ic.check} Consultation complete</div>`;

  </div>`;

};

}

        <div class="row space-between mb10">
          <div><div style="font-weight:700;font-size:14px;">Digital Prescription</div><div class="muted mono" style="font-size:10.5px;">RX-${p.id.toUpperCase()}-${new Date().getDate()}</div></div>
          <div class="avatar sm">${ic.file}</div>
        </div>
        ${pulseDivider()}
        <div class="muted" style="font-size:12px;">${d.name} · ${spec.name}</div>
        <div class="col gap8 mt10">
          <div class="row space-between" style="font-size:13px;"><span>Paracetamol 500mg</span><span class="muted">1-0-1, 5 days</span></div>
          <div class="row space-between" style="font-size:13px;"><span>Cetirizine 10mg</span><span class="muted">0-0-1, 3 days</span></div>
        </div>
      </div>
      <div class="btn-block-row mt14">
        <button class="btn btn-secondary btn-sm" onclick="showToastSafe('Prescription downloaded (PDF)')">${ic.upload} Download</button>
        <button class="btn btn-secondary btn-sm" onclick="showToastSafe('Prescription saved to profile')">${ic.file} Save</button>
        <button class="btn btn-secondary btn-sm" onclick="showToastSafe('Share sheet opened')">${ic.chat} Share</button>
      </div>
      <button class="btn btn-primary mt18" onclick="goRoot('patientHome')">Back to Home</button>
    </div>
  `;
  return withoutNav(topbar('Prescription','', true) + body);
};

/* ============================================================
   BOOT
   ============================================================ */
goRoot('splash');
</script>
</body>
</html>
